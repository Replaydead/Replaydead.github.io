<aside class="sidebar left-sidebar sticky">

    <header>
        <div class="site-meta">
            <h1 class="site-name">
                <a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
            </h1>
        </div>
    </header>

    <ol class="menu">

        {{/* TOP(固定) */}}
        <li>
            <a href="{{ .Site.Home.RelPermalink }}">TOP</a>
        </li>

        {{/* 検索(固定) */}}
        <li>
            <a href="{{ "page/search/" | relURL }}">検索</a>
        </li>

        {{/* 現在階層の兄弟ページ */}}
        {{ with .CurrentSection }}
            {{ range .Pages }}
                <li>
                    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                </li>
            {{ end }}
        {{ end }}

    </ol>

</aside>
