baseURL = "https://replaydead.github.io/"
locale = "ja"
title = "Bleeding Frames"
theme = "hugo-theme-stack"
paginate = 10

[params]
    mainSections = ["posts"]
    defaultTheme = "dark"
    readingSpeed = 500

[params.sidebar]
    emoji = "🎬"
    subtitle = "映画・アニメ・技術"

[params.article]
    math = false
    toc = true
    readingTime = true
    license.enabled = false

[params.colorScheme]
    toggle = true
    default = "dark"

[menu]
