baseURL = "https://Replaydead.github.io/"
locale = "ja"
title = "Bleeding Frames"
theme = "hugo-theme-stack"
paginate = 10

[params]
    mainSections = ["posts"]
    defaultTheme = "dark"

[params.sidebar]
    emoji = "🎬"
    subtitle = "映画・アニメ・技術"

[params.article]
    math = false
    toc = true
    readingTime = true
    license.enabled = false

[params.colorScheme]
    toggle = true
    default = "dark"

[menu]
    [[menu.main]]
        identifier = "drama"
        name = "ドラマレビュー"
        url = "#"
        weight = 1
        [menu.main.params]
            icon = "tv"
    [[menu.main]]
        identifier = "bambino"
        name = "バンビ～ノ！レビュー"
        url = "/categories/バンビ～ノ！レビュー/"
        parent = "drama"
        weight = 1
    [[menu.main]]
        identifier = "movie"
        name = "映画レビュー"
        url = "#"
        weight = 2
        [menu.main.params]
            icon = "movie"
    [[menu.main]]
        identifier = "batman"
        name = "バットマンレビュー"
        url = "/categories/バットマンレビュー/"
        parent = "movie"
        weight = 1

[params.comments]
    enabled = true
    provider = "disqus"

[params.comments.disqus]
    shortname = "bleeding-frames"

disqusShortname = "bleeding-frames"
    
