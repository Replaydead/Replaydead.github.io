baseURL = "https://replaydead.github.io/"
languageCode = "ja"
title = "Bleeding Frames"
theme = "hugo-theme-stack"
paginate = 10
enableRobotsTXT = true

[taxonomies]
category = "categories"
tag = "tags"

[params]
mainSections = ["posts"]
defaultTheme = "dark"
readingSpeed = 500

[params.profile]
name = "Redz"
title = "なんちゃって底辺エンジニア。"
description = "辛口&超個人的意見で映画やアニメなどについて語るブログ。"

[params.article]
math = false
toc = true
readingTime = true
license.enabled = false

[params.colorScheme]
toggle = true
default = "dark"

[menu]

[[menu.main]]
identifier = "home"
name = "ホーム"
url = "/"
weight = 1

[[menu.main]]
identifier = "movie"
name = "映画レビュー"
url = "/categories/movie/"
weight = 2

[[menu.main]]
identifier = "drama"
name = "ドラマレビュー"
url = "/categories/drama/"
weight = 3

[[menu.main]]
identifier = "note"
name = "雑記"
url = "/categories/note/"
weight = 4

[[menu.footer]]
name = "お問い合わせ"
url = "/contact/"
weight = 1

[[menu.footer]]
name = "プライバシーポリシー"
url = "/privacy-policy/"
weight = 2

[[menu.footer]]
name = "免責事項"
url = "/disclaimer/"
weight = 3

[params.comments]
enabled = true
provider = "disqus"

[params.comments.disqus]
shortname = "bleeding-frames"

disqusShortname = "bleeding-frames"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
noClasses = false
style = "monokai"

[params.widgets]
homepage = [{type = "archives", params = {limit = 10}}]

[params.footer]
since = 2026
customText = "開設: 2026/06/09"

[outputs]
home = ["HTML", "RSS", "JSON"]
